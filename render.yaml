services:
  - type: web
    name: projetemma-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: BACK
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ANALYTICS_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@admin.cm
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_SAMPLES
        value: "false"
      # Décommentez et montez un disque persistant sur /var/data
      # pour conserver les photos entre les déploiements.
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads

  - type: web
    name: projetemma-analysis
    runtime: python
    plan: free
    region: frankfurt
    rootDir: ANALYSIS
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FRONTEND_URL
        sync: false
